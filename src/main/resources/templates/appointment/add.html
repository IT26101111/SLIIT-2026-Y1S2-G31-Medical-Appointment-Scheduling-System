<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <title>Add Appointment</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>
  <style>
    .time-slot-btn {
      display: inline-block;
      padding: 8px 14px;
      border:1.5px solid #334155; background:#0b111c; color:#f8fafc;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background:#161f30; border:1px solid rgba(255,255,255,0.08);
      margin: 4px;
    }
    .time-slot-btn:hover {
      border-color:var(--patient-primary, #38bdf8);
      background: #e3f2fd;
      color:var(--patient-primary, #38bdf8);
    }
    .doctor-info-box {
      background:#0f172a;
      border: 2px solid #e3f2fd;
      border-left: 5px solid #1976d2;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
<div class="navbar">
  <a class="logo" href="/home/admin">
    <span class="logo-emoji" style="font-size:20px; line-height:1;">🏥</span>
    <span>DocTime <span style="font-size:11px; color:#64748b; font-weight:400; margin-left:4px;">Admin Portal</span></span>
  </a>
  <nav>
    <a href="/home/admin">
      <span>🏠</span> Home
    </a>
    <a href="/patients">
      <span>👥</span> Patients
    </a>
    <a href="/doctors">
      <span>🩺</span> Doctors
    </a>
    <a href="/appointments">
      <span>📅</span> Appointments
    </a>
    <a href="/scheduling">
      <span>⏱️</span> Scheduling
    </a>
    <a href="/admin">
      <span>⚙️</span> Admin
    </a>
    <a href="/admin/requests">
      <span>🔔</span> Requests
    </a>
    <a href="/logout" class="logout-btn">
      <span>🚪</span> Logout
    </a>
  </nav>
</div>

<div class="main-content">
  <div class="page-header">
    <div>
      <h1>📅 Add Appointment</h1>
      <p>Fill in the appointment details below</p>
    </div>
    <a href="/appointments" class="btn btn-primary">← Back to List</a>
  </div>

  <div class="card" style="max-width: 650px;">
    <form th:action="@{/appointments/add}" method="post">

      <!-- Patient -->
      <div class="form-group">
        <label>Patient Name</label>
        <select id="patientSelect" name="patientName" required>
          <option value="">-- Select Patient --</option>
          <option th:each="p : ${patients}"
                  th:value="${p.name}"
                  th:selected="${p.name == selectedPatient}"
                  th:text="${p.name}">
          </option>
        </select>
      </div>

      <!-- Doctor -->
      <div class="form-group">
        <label>Doctor Name</label>
        <select id="doctorSelect" name="doctorName"
                onchange="updateSlots()" required>
          <option value="">-- Select Doctor --</option>
          <option th:each="d : ${doctors}"
                  th:value="${d.name}"
                  th:selected="${d.name == selectedDoctor}"
                  th:text="'Dr. ' + ${d.name} + ' - ' + ${d.specialization}">
          </option>
        </select>
      </div>

      <!-- Doctor Info Box -->
      <div th:if="${selectedDoctor != null and selectedDoctor != ''}"
           class="doctor-info-box">
        <th:block th:each="s : ${availableSchedules}"
                  th:if="${s.doctorName == selectedDoctor}">
          <p style="font-size:13px; font-weight:700;
                              color:#f8fafc; margin-bottom:8px;">
            🩺 Dr. <span th:text="${selectedDoctor}"></span>
          </p>
          <p style="font-size:13px; color:#555; margin-bottom:4px;">
            📅 <span th:text="${s.availableDays}"></span>
          </p>
          <p style="font-size:13px; color:#555; margin-bottom:4px;">
            ⏰ <span th:text="${s.startTime}"></span>
            — <span th:text="${s.endTime}"></span>
          </p>
          <p style="font-size:13px; color:#555; margin-bottom:4px;">
            🚪 Room: <span th:text="${s.roomNumber}"></span>
          </p>
          <p style="font-size:13px; color:#555;">
            ⏱️ <span th:text="${s.slotDuration}"></span> min per slot
          </p>
        </th:block>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="dateInput"
               name="date"
               th:value="${selectedDate}"
               onchange="updateSlots()" required/>
      </div>

      <!-- Time Slots -->
      <div class="form-group">
        <label>Available Time Slots</label>
        <div th:if="${#lists.isEmpty(availableTimeSlots)}"
             style="background:#0f172a; border:1.5px solid #334155; background:#0b111c; color:#f8fafc;
                            border-radius:8px; padding:15px; text-align:center;
                            color:#64748b; font-size:13px;">
          👆 Select a doctor and date to see available time slots
        </div>
        <div th:if="${!#lists.isEmpty(availableTimeSlots)}"
             style="display:flex; flex-wrap:wrap; gap:4px;">
          <label th:each="slot : ${availableTimeSlots}"
                 style="cursor:pointer;">
            <input type="radio" name="timeSlot"
                   th:value="${slot}" required
                   style="display:none;"/>
            <span th:text="${slot}"
                  class="time-slot-btn"
                  onclick="selectSlot(this)">
                        </span>
          </label>
        </div>
      </div>

      <!-- Urgency -->
      <div class="form-group">
        <label>Urgency Level</label>
        <select name="urgency">
          <option value="1">🔴 High</option>
          <option value="2">🟠 Medium</option>
          <option value="3">🟢 Low</option>
        </select>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button type="submit" class="btn btn-success"
                style="flex:1; padding:13px;">
          ✅ Add Appointment
        </button>
        <a href="/appointments" class="btn btn-danger"
           style="padding:13px 20px;">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
  function updateSlots() {
    const doctor = document.getElementById('doctorSelect').value;
    const date = document.getElementById('dateInput').value;
    const patient = document.getElementById('patientSelect').value;
    if (doctor && date) {
      window.location.href = '/appointments/add/slots?doctorName='
              + encodeURIComponent(doctor)
              + '&date=' + date
              + '&patientName=' + encodeURIComponent(patient);
    }
  }

  function selectSlot(el) {
    document.querySelectorAll('.time-slot-btn').forEach(s => {
      s.style.borderColor = '#e0e0e0';
      s.style.background = 'white';
      s.style.color = '#333';
    });
    el.style.borderColor = '#1976d2';
    el.style.background = '#e3f2fd';
    el.style.color = '#1976d2';
  }
  // Set minimum date to today - cannot select past dates
  document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').min = today;
  });
</script>

</body>
</html>
