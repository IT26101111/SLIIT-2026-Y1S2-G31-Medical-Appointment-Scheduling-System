<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <title>Doctor Management</title>
  <link rel="stylesheet" th:href="@{/style.css}"/>

    <style>
      body {
        background:
          linear-gradient(180deg, rgba(6, 10, 18, 0.68) 0%, rgba(6, 10, 18, 0.78) 100%),
          url('https://images.unsplash.com/photo-1758092922270-05163495a197?q=80&w=1400&auto=format&fit=crop') center/cover fixed no-repeat !important;
        min-height: 100vh;
      }
    </style>

</head>
<body>
<div class="navbar">
  <a class="logo" href="/home/admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:24px; height:24px; color:#ef4444; flex-shrink:0;">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    <span>DocTime <span style="font-size:11px; color:#475569 !important; font-weight:600; font-weight:400; margin-left:4px;">Admin Portal</span></span>
  </a>
  <nav>
    <a href="/home/admin" class="home-link">
      <span>🏠</span> Home
    </a>
    <a href="/patients">
      <span>👥</span> Patients
    </a>
    <a href="/doctors">
      <span>🩺</span> Doctors
    </a>
    <a href="/appointments">
      <span>📅</span> Appointments
    </a>
    <a href="/scheduling">
      <span>⏱️</span> Scheduling
    </a>
    <a href="/admin">
      <span>⚙️</span> Admin
    </a>
    <a href="/admin/requests">
      <span>🔔</span> Requests
    </a>
    <a href="/logout" class="logout-btn">
      <span>🚪</span> Logout
    </a>
  </nav>

  
</div>




<div class="main-content">
  <div class="page-header">
    <div><h1 style="color:#ffffff !important;">Doctor Management</h1><p>Manage all registered doctors</p></div>
    <a href="/doctors/add" class="btn btn-primary">+ Add New Doctor</a>
  </div>
  <!-- STATS BAR -->
  <div style="display: flex; gap: 20px; margin-bottom: 25px;">
    <div style="background:#ffffff !important; border:1px solid #e2e8f0; box-shadow:0 4px 18px rgba(0,0,0,0.12); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
      <h3 style="font-size:24px; color:var(--patient-primary, #38bdf8); font-weight:800;"
          th:text="${#lists.size(doctors)}">0</h3>
      <p style="color:#475569 !important; font-weight:600; font-size:12px; margin-top:4px;">Total Doctors</p>
    </div>
    <div style="background:#ffffff !important; border:1px solid #e2e8f0; box-shadow:0 4px 18px rgba(0,0,0,0.12); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
      <h3 style="font-size:24px; color:var(--doctor-primary, #22c55e); font-weight:800;"
          th:text="${doctors.?[status == 'Approved'].size()}">0</h3>
      <p style="color:#475569 !important; font-weight:600; font-size:12px; margin-top:4px;">Approved</p>
    </div>
    <div style="background:#ffffff !important; border:1px solid #e2e8f0; box-shadow:0 4px 18px rgba(0,0,0,0.12); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
      <h3 style="font-size:24px; color:#fb923c; font-weight:800;"
          th:text="${doctors.?[status == 'Pending'].size()}">0</h3>
      <p style="color:#475569 !important; font-weight:600; font-size:12px; margin-top:4px;">Pending</p>
    </div>
    <div style="background:#ffffff !important; border:1px solid #e2e8f0; box-shadow:0 4px 18px rgba(0,0,0,0.12); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:15px 20px;
                box-shadow:0 4px 15px rgba(0,0,0,0.07); text-align:center; flex:1;">
      <h3 style="font-size:24px; color:var(--admin-primary, #ef4444); font-weight:800;"
          th:text="${doctors.?[status == 'Rejected'].size()}">0</h3>
      <p style="color:#475569 !important; font-weight:600; font-size:12px; margin-top:4px;">Rejected</p>
    </div>
  </div>
  <!-- SEARCH BAR -->
  <div style="display:flex; gap:10px; margin-bottom:20px; align-items:center;">
    <input type="text" id="searchInput"
           placeholder="🔍 Search by doctor name..."
           onkeyup="filterDoctors()"
           style="padding:10px 15px; border:1.5px solid #334155; background:#0b111c; color:#f8fafc;
                  border-radius:8px; font-size:14px; outline:none;
                  width:300px; transition:border 0.3s ease;"
           onfocus="this.style.borderColor='#38bdf8'"
           onblur="this.style.borderColor='#334155'"/>
    <select id="specializationFilter" onchange="filterDoctors()"
            style="padding:10px 15px; border:1.5px solid #334155; background:#0b111c; color:#f8fafc;
                   border-radius:8px; font-size:14px; outline:none;
                   transition:border 0.3s ease;"
            onfocus="this.style.borderColor='#38bdf8'"
            onblur="this.style.borderColor='#334155'">
      <option value="">All Specializations</option>
      <option value="Cardiologist">❤️ Cardiologist</option>
      <option value="Dermatologist">🧴 Dermatologist</option>
      <option value="Neurologist">🧠 Neurologist</option>
      <option value="Pediatrician">👶 Pediatrician</option>
      <option value="Surgeon">🔪 Surgeon</option>
      <option value="General Practitioner">🩺 General Practitioner</option>
    </select>
    <select id="statusFilter" onchange="filterDoctors()"
            style="padding:10px 15px; border:1.5px solid #334155; background:#0b111c; color:#f8fafc;
                   border-radius:8px; font-size:14px; outline:none;
                   transition:border 0.3s ease;"
            onfocus="this.style.borderColor='#38bdf8'"
            onblur="this.style.borderColor='#334155'">
      <option value="">All Status</option>
      <option value="Approved">✅ Approved</option>
      <option value="Pending">⏳ Pending</option>
      <option value="Rejected">❌ Rejected</option>
    </select>
  </div>

  <script>
    function filterDoctors() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const specialization = document.getElementById('specializationFilter').value;
      const status = document.getElementById('statusFilter').value;
      const rows = document.querySelectorAll('.doctor-row');

      rows.forEach(row => {
        const name = row.getAttribute('data-name').toLowerCase();
        const rowSpec = row.getAttribute('data-specialization');
        const rowStatus = row.getAttribute('data-status');

        const matchName = name.includes(search);
        const matchSpec = specialization === '' || rowSpec === specialization;
        const matchStatus = status === '' || rowStatus === status;

        row.style.display = (matchName && matchSpec && matchStatus) ? '' : 'none';
      });
    }
  </script>
  <div class="card">
    <table>
      <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Phone</th><th>Specialization</th><th>Availability</th><th>Status</th><th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="doctor : ${doctors}"
          class="doctor-row"
          th:attr="data-name=${doctor.name},
             data-specialization=${doctor.specialization},
             data-status=${doctor.status}">
        <td><span class="badge badge-blue" th:text="${doctor.id}"></span></td>
        <td th:text="${doctor.name}"></td>
        <td th:text="${doctor.phone}"></td>
        <td><span class="badge badge-green" th:text="${doctor.specialization}"></span></td>
        <td><span class="badge badge-orange" th:text="${doctor.availability}"></span></td>
        <td>
                        <span class="badge"
                              th:classappend="${doctor.status == 'Approved'} ? 'badge-green' : (${doctor.status == 'Pending'} ? 'badge-orange' : 'badge-red')"
                              th:text="${doctor.status}"></span>
        </td>
        <td>
          <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-warning" style="padding:6px 14px; font-size:12px;">Edit</a>
          <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}" class="btn btn-danger" style="padding:6px 14px; font-size:12px;" onclick="return confirm('Are you sure?')">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script>

function animateCount(el, target) {
  var step = Math.max(1, Math.ceil(target / 36));
  var cur = 0;
  el.textContent = '0';
  var t = setInterval(function() {
    cur = Math.min(cur + step, target);
    el.textContent = cur;
    if (cur >= target) clearInterval(t);
  }, 16);
}
document.addEventListener('DOMContentLoaded', function() {
  var selectors = ['.stat-box h3', '.stat-box-info h3', '.stat-cell h3', '.stat-mini h3', '.white-stat-box h3', '.stat-item h3', '.stat-card h3', '[style*="font-size:24px"]', '[style*="font-size:28px"]'];
  document.querySelectorAll(selectors.join(',')).forEach(function(el) {
    var n = parseInt(el.textContent.replace(/[^0-9]/g, ''), 10);
    if (!isNaN(n) && n > 0) animateCount(el, n);
  });
});
</script>

</body>
</html>
