            <option value="">All Roles</option>

    <script>
        function filterAdmins() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;
            const rows = document.querySelectorAll('.admin-row');

            rows.forEach(row => {
                const name = row.getAttribute('data-name').toLowerCase();
                const rowRole = row.getAttribute('data-role');

                const matchName = name.includes(search);
                const matchRole = role === '' || rowRole === role;

                row.style.display = (matchName && matchRole) ? '' : 'none';
            });
        }
    </script>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>Name</th><th>Phone</th><th>Username</th><th>Role</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${admins}"
                class="admin-row"
                th:attr="data-name=${a.name},
             data-role=${a.role}">
                <td><span class="badge badge-blue" th:text="${a.id}"></span></td>
                <td th:text="${a.name}"></td>
                <td th:text="${a.phone}"></td>
                <td th:text="${a.username}"></td>
                <td><span class="badge badge-green" th:text="${a.role}"></span></td>
                <td>
                    <a th:href="@{/admin/edit/{id}(id=${a.id})}" class="btn btn-warning" style="padding:6px 14px; font-size:12px;">Edit</a>
                    <a th:href="@{/admin/delete/{id}(id=${a.id})}" class="btn btn-danger" style="padding:6px 14px; font-size:12px;" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>

function animateCount(el, target) {
  var step = Math.max(1, Math.ceil(target / 36));
  var cur = 0;
  el.textContent = '0';
  var t = setInterval(function() {
    cur = Math.min(cur + step, target);
    el.textContent = cur;
    if (cur >= target) clearInterval(t);
  }, 16);
}
document.addEventListener('DOMContentLoaded', function() {
  var selectors = ['.stat-box h3', '.stat-box-info h3', '.stat-cell h3', '.stat-mini h3', '.white-stat-box h3', '.stat-item h3', '.stat-card h3', '[style*="font-size:24px"]', '[style*="font-size:28px"]'];
  document.querySelectorAll(selectors.join(',')).forEach(function(el) {
    var n = parseInt(el.textContent.replace(/[^0-9]/g, ''), 10);
    if (!isNaN(n) && n > 0) animateCount(el, n);
  });
});
</script>
